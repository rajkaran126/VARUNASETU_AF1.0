name: Render Production Deployment

on:
  push:
    branches: [main, vishwas]
  pull_request:
    branches: [main, vishwas]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  render-deploy:
    name: Verify & Deploy to Render
    runs-on: ubuntu-latest
    environment:
      name: Render Production
      url: https://varunasetu-af1-0.onrender.com/
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile & Build Next.js 15
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Trigger Render Deploy Hook (if secret configured)
        if: env.DEPLOY_HOOK != ''
        run: |
          echo "Pinging Render Deploy Hook..."
          curl -s -X POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
