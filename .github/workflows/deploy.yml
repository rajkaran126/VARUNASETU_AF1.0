name: Production CI & Deployment

on:
  push:
    branches: [main, vishwas]
  pull_request:
    branches: [main, vishwas]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  verify-and-deploy:
    name: Build & Deployment Verification
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://github.com/rajkaran126/VARUNASETU_AF1.0
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile & Build Next.js 15
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
